name: Scheduled Upstream Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.KASHCAL_SYNC }}
        run: |
          gh repo sync ${{ github.repository }} --branch main

      - id: after
        run: |
          git fetch origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - if: steps.before.outputs.sha != steps.after.outputs.sha
        run: gh workflow run codeberg-mirror.yml --repo ${{ github.repository }} --ref sync
        env:
          GH_TOKEN: ${{ secrets.KASHCAL_SYNC }}
