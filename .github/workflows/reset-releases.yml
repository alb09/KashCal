name: Cleanup Codeberg Releases

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all Codeberg releases and tags
        env:
          CODEBERG_API: https://codeberg.org/api/v1
          TARGET_REPO_CODEBERG: alexb936/KashCal
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
        run: |
          echo "🔍 Hole Releases..."
          
          releases=$(curl -s "$CODEBERG_API/repos/$TARGET_REPO_CODEBERG/releases" \
            -H "Authorization: token $CODEBERG_TOKEN" | jq -r '.[] | "\(.id):\(.tag_name)"')

          if [ -z "$releases" ]; then
            echo "ℹ️  Keine Releases gefunden"
            exit 0
          fi

          while IFS=: read -r release_id tag_name; do
            echo "🗑️  Lösche Release ID: $release_id (Tag: $tag_name)..."
            
            # Release löschen
            curl -s -X DELETE "$CODEBERG_API/repos/$TARGET_REPO_CODEBERG/releases/$release_id" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json"
            
            echo "✅ Release gelöscht, lösche nun Tag '$tag_name'..."
            
            # Tag löschen (optional, aber sauberer)
            curl -s -X DELETE "$CODEBERG_API/repos/$TARGET_REPO_CODEBERG/tags/$tag_name" \
              -H "Authorization: token $CODEBERG_TOKEN" 2>/dev/null || true
              
          done <<< "$releases"

          echo "✅ Cleanup abgeschlossen"
