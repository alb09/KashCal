name: Mirror to Codeberg
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push mirror (main + tags, 1:1 from upstream)
        env:
          SSH_KEY: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
        run: ./.github/scripts/mirror-git-codeberg.sh
