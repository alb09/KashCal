name: Sync Releases
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      initial_sync:
        description: 'Alle Releases syncen (Metadaten, immer alt -> neu)'
        required: false
        default: 'false'
      apk_count:
        description: 'Anzahl Releases, für die APKs hochgeladen werden (0 = keine)'
        required: false
        default: '5'
      apk_direction:
        description: 'Welche Releases (bei apk_count) — älteste oder neueste zuerst'
        required: false
        type: choice
        default: 'newest'
        options:
          - newest
          - oldest
      max_apk_retain:
        description: 'Max. Anzahl Releases mit APK auf Codeberg'
        required: false
        default: '27'

# Nur als Fallback für den Cron-Trigger (schedule hat keine Inputs).
# Bei Änderung: unbedingt mit den Input-Defaults oben synchron halten.
env:
  DEFAULT_APK_COUNT: '5'
  DEFAULT_APK_DIRECTION: 'newest'
  DEFAULT_MAX_APK_RETAIN: '27'

permissions:
  contents: write
jobs:
  sync-github:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: "KashCal/KashCal"
      TARGET_REPO: "${{ github.repository }}"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          chmod +x ./.github/scripts/sync-releases.sh
          ./.github/scripts/sync-releases.sh 5 ${{ github.event.inputs.initial_sync || 'false' }}
  sync-codeberg:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: "KashCal/KashCal"
      TARGET_REPO_CODEBERG: "alexb936/KashCal"
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          chmod +x ./.github/scripts/sync-releases-codeberg.sh
          ./.github/scripts/sync-releases-codeberg.sh 5 \
            ${{ github.event.inputs.initial_sync || 'false' }} \
            ${{ github.event.inputs.apk_count || env.DEFAULT_APK_COUNT }} \
            ${{ github.event.inputs.apk_direction || env.DEFAULT_APK_DIRECTION }} \
              ${{ github.event.inputs.max_apk_retain || env.DEFAULT_MAX_APK_RETAIN }}
