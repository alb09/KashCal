name: Sync Releases
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      initial_sync:
        description: 'Sync all releases'
        required: false
        default: 'false'
      sync_assets:
        description: 'APKs hochladen (false = nur Release-Metadaten)'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  sync-github:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: "KashCal/KashCal"
      TARGET_REPO: "${{ github.repository }}"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          chmod +x ./.github/scripts/sync-releases.sh
          ./.github/scripts/sync-releases.sh 5 ${{ github.event.inputs.initial_sync || 'false' }}
  sync-codeberg:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: "KashCal/KashCal"
      TARGET_REPO_CODEBERG: "alexb936/KashCal"
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          chmod +x ./.github/scripts/sync-releases-codeberg.sh
          ./.github/scripts/sync-releases-codeberg.sh 15 ${{ github.event.inputs.initial_sync || 'false' }} ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.sync_assets || 'false') || 'false' }}
