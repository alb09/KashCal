name: Sync Releases from Upstream

on:
  schedule:
    - cron: '*/30 * * * *'  # alle 30 Min
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: "KashCal/KashCal"
      TARGET_REPO: "${{ github.repository }}"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for new release and sync if needed
        run: |
          chmod +x ./.github/scripts/sync-releases.sh
          ./.github/scripts/sync-releases.sh 5 ${{ github.event.inputs.initial_sync || 'false' }}
